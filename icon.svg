<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121d18"/>
      <stop offset="100%" stop-color="#0b1310"/>
    </linearGradient>
    
    <!-- Accent Mint Glow -->
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80f1ca"/>
      <stop offset="100%" stop-color="#51d3a7"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#80f1ca" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#233a30" stroke-width="4"/>

  <!-- Studio Sound Waves (Left & Right) -->
  <g fill="none" stroke="#233a30" stroke-width="12" stroke-linecap="round">
    <path d="M 120 216 Q 100 256 120 296" />
    <path d="M 80 186 Q 50 256 80 326" />
    <path d="M 392 216 Q 412 256 392 296" />
    <path d="M 432 186 Q 462 256 432 326" />
  </g>

  <!-- Audio Level EQ Bars (Mint) -->
  <g fill="url(#mintAccent)" opacity="0.4">
    <rect x="140" y="226" width="8" height="60" rx="4"/>
    <rect x="364" y="226" width="8" height="60" rx="4"/>
  </g>

  <!-- Geometric Microphone Capsule -->
  <g filter="url(#glow)">
    <!-- Capsule Body -->
    <rect x="206" y="128" width="100" height="170" rx="50" fill="#182822" stroke="url(#mintAccent)" stroke-width="10"/>
    
    <!-- Inner Mesh Lines -->
    <line x1="206" y1="188" x2="306" y2="188" stroke="#233a30" stroke-width="6"/>
    <line x1="256" y1="128" x2="256" y2="228" stroke="#233a30" stroke-width="4"/>

    <!-- U-Shaped Mounting Yoke -->
    <path d="M 176 230 V 270 A 80 80 0 0 0 336 270 V 230" fill="none" stroke="url(#mintAccent)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Base Stem and Stand -->
    <line x1="256" y1="350" x2="256" y2="400" stroke="url(#mintAccent)" stroke-width="12" stroke-linecap="round"/>
    <line x1="196" y1="400" x2="316" y2="400" stroke="url(#mintAccent)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
